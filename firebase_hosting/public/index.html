<!DOCTYPE html>
<!--suppress ALL -->
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UniTrack+ | 重設密碼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    body {
      background-color: #0B1120;
      color: #F8FAFC;
      font-family: sans-serif;
    }
    .mesh-bg {
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 45%);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="min-h-screen mesh-bg flex items-center justify-center p-4">
  <div class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 space-y-6">
    <!-- Header Logo & Title -->
    <div class="text-center space-y-3">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 shadow-lg shadow-blue-500/25 border border-white/20">
        <span class="text-3xl">🎓</span>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">重設您的密碼</h1>
        <p class="text-xs text-blue-400 font-semibold tracking-wider uppercase mt-1">UniTrack+ 大學生日常助手</p>
      </div>
      <p id="account-hint" class="text-sm text-slate-400 font-medium">正在驗證您的重設請求連結...</p>
    </div>

    <!-- Loading Indicator -->
    <div id="loading-box" class="flex justify-center py-6">
      <div class="w-8 h-8 border-4 border-blue-500/30 border-t-blue-500 rounded-full animate-spin"></div>
    </div>

    <!-- Reset Form -->
    <form id="reset-form" class="hidden space-y-4" onsubmit="handlePasswordReset(event)">
      <div class="space-y-1.5">
        <label for="new-password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">設定新密碼</label>
        <div class="relative">
          <input type="password" id="new-password" required minlength="6" placeholder="請輸入新密碼 (至少 6 位)"
            class="w-full px-4 py-3.5 pr-11 bg-slate-900/70 border border-white/15 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
            oninput="checkPasswordStrength()">
          <button type="button" onclick="togglePasswordVisibility('new-password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>

        <!-- Strength Indicator Bar -->
        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mt-2">
          <div id="strength-bar" class="h-full w-0 transition-all duration-300 rounded-full bg-slate-600"></div>
        </div>
        <p id="strength-text" class="text-[11px] text-slate-400">密碼強度：請輸入密碼</p>
      </div>

      <div class="space-y-1.5">
        <label for="confirm-password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">確認新密碼</label>
        <div class="relative">
          <input type="password" id="confirm-password" required minlength="6" placeholder="請再次輸入新密碼"
            class="w-full px-4 py-3.5 pr-11 bg-slate-900/70 border border-white/15 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
          <button type="button" onclick="togglePasswordVisibility('confirm-password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn"
        class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/25 transition active:scale-[0.98] mt-2">
        確認更新密碼
      </button>
    </form>

    <!-- Status Message Alert Box -->
    <div id="status-box" class="hidden p-4 rounded-2xl text-sm leading-relaxed text-center font-medium"></div>

    <!-- Footer -->
    <div class="text-center pt-2">
      <p class="text-xs text-slate-500">© 2026 UniTrack+. All rights reserved.</p>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyDAoH77HI5XamJ4-z4G85xf3YQs_a6JH50",
      authDomain: "unitrack2027-bbc01.firebaseapp.com",
      projectId: "unitrack2027-bbc01",
      appId: "1:742695547810:android:aef58b7753c13b8ddaf8fb"
    };

    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();

    var urlParams = new URLSearchParams(window.location.search);
    var mode = urlParams.get("mode");
    var oobCode = urlParams.get("oobCode");

    var loadingBox = document.getElementById("loading-box");
    var resetForm = document.getElementById("reset-form");
    var accountHint = document.getElementById("account-hint");

    if (mode === "resetPassword" && oobCode) {
      auth.verifyPasswordResetCode(oobCode)
        .then(function(email) {
          loadingBox.classList.add("hidden");
          resetForm.classList.remove("hidden");
          accountHint.innerHTML = "帳號 <span class=\"text-blue-400 font-semibold\">" + email + "</span>";
        })
        .catch(function(err) {
          loadingBox.classList.add("hidden");
          showStatus("此重設密碼連結已過期或已被使用，請重新在 App 中發送重設信。", "error");
        });
    } else {
      loadingBox.classList.add("hidden");
      showStatus("缺少有效的重設驗證代碼，請確認點擊信件中的完整連結。", "error");
    }

    function togglePasswordVisibility(inputId) {
      var input = document.getElementById(inputId);
      input.type = input.type === "password" ? "text" : "password";
    }

    function checkPasswordStrength() {
      var val = document.getElementById("new-password").value;
      var bar = document.getElementById("strength-bar");
      var text = document.getElementById("strength-text");

      if (val.length === 0) {
        bar.style.width = "0%";
        bar.className = "h-full transition-all duration-300 rounded-full bg-slate-600";
        text.textContent = "密碼強度：請輸入密碼";
      } else if (val.length < 6) {
        bar.style.width = "30%";
        bar.className = "h-full transition-all duration-300 rounded-full bg-rose-500";
        text.textContent = "密碼強度：太弱（需至少 6 字元）";
        text.className = "text-[11px] text-rose-400 font-medium";
      } else if (val.length < 10) {
        bar.style.width = "70%";
        bar.className = "h-full transition-all duration-300 rounded-full bg-amber-500";
        text.textContent = "密碼強度：良好";
        text.className = "text-[11px] text-amber-400 font-medium";
      } else {
        bar.style.width = "100%";
        bar.className = "h-full transition-all duration-300 rounded-full bg-emerald-500";
        text.textContent = "密碼強度：非常強固";
        text.className = "text-[11px] text-emerald-400 font-medium";
      }
    }

    function handlePasswordReset(e) {
      e.preventDefault();
      var p1 = document.getElementById("new-password").value;
      var p2 = document.getElementById("confirm-password").value;

      if (p1 !== p2) {
        showStatus("兩次輸入的密碼不一致，請再次確認。", "error");
        return;
      }

      var btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "正在更新密碼...";

      auth.confirmPasswordReset(oobCode, p1)
        .then(function() {
          resetForm.classList.add("hidden");
          accountHint.textContent = "密碼重設完成";
          showStatus("🎉 密碼已成功更新！您現在可以使用新密碼返回 UniTrack+ App 登入。", "success");
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = "確認更新密碼";
          showStatus("密碼更新失敗：" + err.message, "error");
        });
    }

    function showStatus(msg, type) {
      var box = document.getElementById("status-box");
      box.textContent = msg;
      box.className = "p-4 rounded-2xl text-sm leading-relaxed text-center font-medium " + 
        (type === "success" 
          ? "bg-emerald-500/15 text-emerald-300 border border-emerald-500/30" 
          : "bg-rose-500/15 text-rose-300 border border-rose-500/30");
      box.classList.remove("hidden");
    }
  </script>
</body>
</html>
